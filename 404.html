<style>
  .rr { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: var(--s-4); }
  .rr-card { width: 100%; max-width: 460px; text-align: center; }
  .rr-logo { font-weight: 800; font-size: 20px; color: var(--gold); letter-spacing: -0.025em; display: inline-block; margin-bottom: var(--s-4); }
  .rr-code { font-family: var(--font-mono); font-size: clamp(28px, 8vw, 44px); font-weight: 700; letter-spacing: 0.12em; color: var(--gold); background: var(--card); border: 1px solid var(--gold-border); border-radius: var(--radius-md); padding: 14px 22px; display: inline-block; margin: 14px 0 10px; }
  .rr-copy { font-size: 13px; color: var(--text-subtle); background: transparent; border: 1px solid var(--border-strong); border-radius: var(--radius-pill); padding: 7px 16px; cursor: pointer; }
  .rr-steps { color: var(--text-subtle); font-size: 15px; margin-top: var(--s-4); line-height: 1.6; }
  .rr .appstore-badge { margin-top: var(--s-4); }
  .rr .eyebrow::after { content: ''; width: 20px; height: 1px; background: linear-gradient(90deg, var(--gold), transparent); flex-shrink: 0; }

<body>
<div class="rr">
  <div class="rr-card">
    <a href="/" class="rr-logo">Versus<span class="nav-logo-dot"></span></a>
    <div id="rr-slot"></div>
  </div>
</div>
<script>
(function () {
  var APPSTORE = 'https://apps.apple.com/app/id6760545665';
  var badge = '<a class="appstore-badge" href="' + APPSTORE + '" aria-label="Download Versus Training on the App Store"><img src="/assets/appstore-badge.svg" alt="Download on the App Store"/></a>';
  var slot = document.getElementById('rr-slot');

  function esc(s) { return s.replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  var m = location.pathname.match(/^\/r\/([^\/?#]+)/);
  if (m) {
    var code = decodeURIComponent(m[1]).toUpperCase().replace(/[^A-Z0-9\-]/g, '').slice(0, 32);
    slot.innerHTML =
      '<p class="eyebrow">You\'ve been invited</p>' +
      '<h1 style="margin-top:12px">Get <span class="accent-gold">7 free days of Core</span>.</h1>' +
      '<p class="subhead" style="margin-top:16px;color:var(--text-subtle)">You and your friend both get 7 free days of Core when you join with this code.</p>' +
      '<div class="rr-code">' + esc(code) + '</div><br/>' +
      '<button class="rr-copy" type="button" id="rr-copy">Copy code</button>' +
      badge +
      '<p class="rr-steps">Download Versus, then enter this code when you sign up.</p>';
    var btn = document.getElementById('rr-copy');
    btn.addEventListener('click', function () {
      var done = function () { btn.textContent = 'Copied ✓'; setTimeout(function () { btn.textContent = 'Copy code'; }, 1800); };
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(code).then(done, done); } else { done(); }
    });
    if (window.posthog && window.posthog.capture) { try { window.posthog.capture('referral_link_opened', { code: code }); } catch (e) {} }
  } else {
    slot.innerHTML =
      '<p class="eyebrow">404</p>' +
      '<h1 style="margin-top:12px">Page not found.</h1>' +
      '<p class="subhead" style="margin-top:16px;color:var(--text-subtle)">That page doesn\'t exist. Head back home, or grab the app.</p>' +
      '<div style="margin-top:var(--s-4)"><a class="btn btn-ghost btn-lg" href="/">Go home</a></div>' +
      badge;
    if (window.posthog && window.posthog.capture) { try { window.posthog.capture('page_404', { path: location.pathname }); } catch (e) {} }
  }
})();
</script>
